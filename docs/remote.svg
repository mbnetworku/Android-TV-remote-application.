    <radialGradient id="b2" cx="0.9" cy="0.45" r="0.7"><stop offset="0" stop-color="#9B4DFF" stop-opacity="0.55"/><stop offset="1" stop-color="#9B4DFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3" cx="0.2" cy="0.85" r="0.65"><stop offset="0" stop-color="#00C2B8" stop-opacity="0.55"/><stop offset="1" stop-color="#00C2B8" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="1" stop-color="#fff" stop-opacity="0.06"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23262D"/><stop offset="1" stop-color="#0B0C0F"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.08" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><clipPath id="phone"><rect width="360" height="740" rx="40"/></clipPath>
  </defs>
